<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Scheme Switcher</title>
    <link rel="stylesheet" href="pro1.css">
</head>
<body>
    <div class="canvas">
        <h1>Color Scheme Switcher</h1>
